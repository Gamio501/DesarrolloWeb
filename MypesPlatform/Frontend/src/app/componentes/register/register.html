<div class="vista-register">
    <div class="form-card">
        <h1>Crear cuenta</h1>

        <form [formGroup]="registerForm" (ngSubmit)="enviarDatos()">

            <div class="form-group">
                <label>Usuario</label>
                <input type="text" formControlName="username" placeholder="Nombre de usuario">
            </div>

            <div class="form-group">
                <label>Correo</label>
                <input type="email" formControlName="email" placeholder="tucorreo@ejemplo.com">
                <small class="form-error" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
                    Ingresa un correo válido.
                </small>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" formControlName="password" placeholder="Mínimo 8 caracteres, mayúscula, minúscula, número y símbolo">
                <small class="form-error" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
                    Debe tener 8-64 caracteres, mayúscula, minúscula, número y carácter especial.
                </small>
            </div>

            <div class="form-group">
                <label>Confirmar contraseña</label>
                <input type="password" formControlName="confirmarPassword" placeholder="Repite la contraseña">
                <small class="form-error" *ngIf="registerForm.errors?.['passwordsNoCoinciden'] && registerForm.get('confirmarPassword')?.touched">
                    Las contraseñas no coinciden.
                </small>
            </div>

            <div class="form-group">
                <label>Tipo de cuenta</label>
                <select formControlName="rol">
                    <option value="CLIENTE">Usuario (comprar)</option>
                    <option value="ADMIN">Tienda (propietario)</option>
                </select>
            </div>

            <div class="seccion-tienda" *ngIf="rolSeleccionado === 'ADMIN'">
                <p class="seccion-titulo">Datos de tu tienda</p>

                <div class="form-group">
                    <label>Nombre de la tienda</label>
                    <input type="text" formControlName="nombreTienda" placeholder="Ej: Mi Bodega">
                </div>
                <div class="form-group">
                    <label>Dirección</label>
                    <input type="text" formControlName="direccion" placeholder="Av. Principal 123">
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" formControlName="telefono" placeholder="999 999 999">
                </div>
            </div>

            <button type="submit" class="btn-primario" [disabled]="registerForm.invalid">Registrarse</button>

        </form>

        <p class="form-footer">
            ¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesión</a>
        </p>
    </div>
</div>
