<div class="panel-admin">

    <div class="seccion-lista">
        <h2>Mis Productos</h2>

        <p class="estado-vacio" *ngIf="productos.length === 0">
            Aún no tienes productos. Agrega el primero →
        </p>

        <table class="tabla-productos" *ngIf="productos.length > 0">
            <thead>
                <tr>
                    <th>Imagen</th>
                    <th>Nombre</th>
                    <th>Precio (S/)</th>
                    <th>Stock</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let producto of productos">
                    <td>
                        <img *ngIf="producto.imagenUrl" [src]="producto.imagenUrl" class="img-thumb" width="50" height="50">
                        <span *ngIf="!producto.imagenUrl" class="sin-img">Sin img</span>
                    </td>
                    <td>{{ producto.nombre }}</td>
                    <td>{{ producto.precio }}</td>
                    <td>{{ producto.stock }}</td>
                    <td>
                        <label class="btn-cambiar-img">
                            Cambiar imagen
                            <input type="file" accept="image/*" (change)="cambiarImagen(producto, $event)" hidden>
                        </label>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="seccion-formulario">
        <h2>Agregar Producto</h2>

        <form [formGroup]="productoForm" (ngSubmit)="guardarProductos()">
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" formControlName="nombre" placeholder="Ej: Arroz 1kg">
            </div>
            <div class="form-group">
                <label>Precio (S/)</label>
                <input type="number" formControlName="precio" placeholder="0.00">
            </div>
            <div class="form-group">
                <label>Stock</label>
                <input type="number" formControlName="stock" placeholder="0">
            </div>
            <div class="form-group">
                <label>Imagen (opcional)</label>
                <input type="file" accept="image/*" (change)="onImagenProductoSeleccionada($event)">
            </div>
            <button type="submit" class="btn-guardar" [disabled]="productoForm.invalid">
                Guardar Producto
            </button>
        </form>
    </div>

</div>
