
spring.sql.init.platform=postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/db_mype
spring.datasource.username=postgres
spring.datasource.password=011317
spring.jpa.show-sql=true
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=20

# El esquema ahora lo maneja Flyway (db/migration/), no Hibernate auto-DDL.
# baseline-on-migrate: la BD de dev ya tiene V1 aplicado a mano (via ddl-auto=update
# durante el desarrollo) -> Flyway lo marca como ya corrido en vez de re-ejecutarlo.
# Una BD nueva (deploy limpio) sí ejecuta V1 completo desde cero.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.web.resources.static-locations=classpath:/static/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.port=8880
app.base-url=http://localhost:8880
app.cors.allowed-origin=http://localhost:4200
app.jwt.secret=${JWT_SECRET:mypesplataformaseguridadjwt2026proyectofinal}
app.jwt.expiration-ms=3600000
app.vosk.model-path=models/vosk-model-small-es-0.42